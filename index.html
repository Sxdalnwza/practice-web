<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exam Practice</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar">
      <div class="logo">Logo</div>

      <ul class="nav-links">
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
      <div class="hero-text">
        <h1>Hero Title</h1>
        <p>
          Hero description
          <span class="inline-text">Inline Example</span>
        </p>

        <!-- ปุ่มแบบ inline-block -->
        <a href="" class="btn">Get Started</a>
      </div>

      <div class="hero-image">
        <img src="https://placehold.co/400x250" alt="Hero" />
      </div>
    </section>

    <!-- Form Section -->
    <section class="form-section">
      <h2>Form</h2>

      <form>
        <!-- Input 2 คอลัมน์ -->
        <div class="form-row">
          <input type="text" placeholder="ชื่อ" required />

          <input type="email" placeholder="อีเมล" required />
        </div>

        <!-- Radio Buttons -->
        <div class="radio-row">
          <input type="radio"id="gender-male" name="gender"value="male" required/>
          <label for="gender-male">ชาย</label>

          <input type="radio" id="gender-female" name="gender" value="female" required/>
          <label for="gender-female">หญิง</label>
        </div>

        <!-- ปุ่มSubmit Block -->
        <button type="submit" class="btn-submit">Submit</button>
      </form>
    </section>

    <!-- Card Section -->
    <section class="card-section">
      <h2>Cards</h2>

      <div class="card-grid">
        <div class="card">Card 1</div>
        <div class="card">Card 2</div>
        <div class="card">Card 3</div>
      </div>
    </section>
  </body>
</html>
